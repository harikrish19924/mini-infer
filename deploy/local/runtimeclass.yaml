# RuntimeClass "nvidia" for the local k3d mirror.
#
# GPU pods (vLLM) ask for runtimeClassName: nvidia. On E2E that name selects
# containerd's NVIDIA runtime, which injects the GPU device files and driver
# libraries (bootstrap-gpu-node.sh creates it with handler: nvidia). Here there
# is no GPU, so the same name points at the normal runtime, runc. That way the
# same manifests and Helm chart schedule unchanged in both clusters.
#
# Applied by scripts/local-up.sh.
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: nvidia
handler: runc
