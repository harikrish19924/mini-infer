apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "vllm.fullname" . }}-test-connection"
  labels:
    {{- include "vllm.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      # vLLM returns 404 on /, so check /health instead.
      args: ['-qO-', 'http://{{ include "vllm.fullname" . }}:{{ .Values.service.port }}/health']
  restartPolicy: Never
